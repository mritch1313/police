name: Build Android APK

on:
  push:
    branches: [ "main", "arena/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Project Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check project structure
        run: |
          echo "Checking Unity project structure..."
          ls -la
          test -f Packages/manifest.json || (echo "Missing Packages/manifest.json" && exit 1)
          test -f ProjectSettings/ProjectVersion.txt || (echo "Missing ProjectVersion.txt" && exit 1)
          test -f Assets/Scenes/Main.unity || (echo "Missing Main.unity" && exit 1)
          test -d Assets/Scripts || (echo "Missing Scripts" && exit 1)
          echo "Structure OK"
          cat ProjectSettings/ProjectVersion.txt
          cat Packages/manifest.json

      - name: Check C# syntax (basic)
        run: |
          echo "Checking C# files..."
          find Assets/Scripts -name "*.cs" | wc -l
          python3 - << 'PY'
          import glob
          errors=0
          for path in glob.glob("Assets/Scripts/**/*.cs", recursive=True):
              with open(path, 'r', errors='ignore') as f:
                  content=f.read()
                  if content.count('{') != content.count('}'):
                      print(f"BRACE MISMATCH: {path}")
                      errors+=1
          if errors>0:
              exit(1)
          print("C# syntax basic check passed")
          PY

      - name: Check Unity version
        run: |
          echo "Unity version: $(cat ProjectSettings/ProjectVersion.txt)"
          grep -q "6000.3" ProjectSettings/ProjectVersion.txt || (echo "Wrong Unity version" && exit 1)

      - name: Check key scripts
        run: |
          test -f Assets/Scripts/Vehicle/VehicleController.cs
          test -f Assets/Scripts/AI/PoliceAI.cs
          test -f Assets/Scripts/World/WorldStreamer.cs
          test -f Assets/Scripts/Core/GameState.cs
          test -f Assets/Editor/BuildScript.cs
          echo "Key scripts OK"
          echo "BUILD NOT VERIFIED (requires Unity) - but structure OK"

  build:
    name: Build Police Chase APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check for Unity license
        id: check_license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE not set - will skip real build"
            echo "has_license=false" >> $GITHUB_OUTPUT
          else
            echo "UNITY_LICENSE present"
            echo "has_license=true" >> $GITHUB_OUTPUT
          fi

      - name: Cache Library
        if: steps.check_license.outputs.has_license == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Cache Gradle
        if: steps.check_license.outputs.has_license == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            Library/Bee/Android
          key: gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-

      - name: Free disk space
        if: steps.check_license.outputs.has_license == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Build Unity project
        if: steps.check_license.outputs.has_license == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.3.0f1
          buildMethod: BuildScript.BuildAndroidInternal
          customParameters: -logFile /tmp/unity.log -stackTraceLogType Full -quit -batchmode -nographics
          allowDirtyBuild: true

      - name: Show Unity log on failure
        if: failure() && steps.check_license.outputs.has_license == 'true'
        run: |
          echo "=== Unity log ==="
          cat /tmp/unity.log || echo "No log file"
          ls -la Builds/ || echo "No Builds folder"

      - name: Check APK exists
        if: steps.check_license.outputs.has_license == 'true'
        run: |
          echo "Checking for APK..."
          ls -lh Builds/ || echo "Builds folder missing"
          APK=$(find Builds -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "APK found: $APK"
          ls -lh "$APK"
          echo "BUILD VERIFIED"

      - name: Upload APK artifact
        if: steps.check_license.outputs.has_license == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PoliceChase-APK
          path: Builds/*.apk
          retention-days: 14

      - name: Upload build logs
        if: always() && steps.check_license.outputs.has_license == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            /tmp/unity.log
            Library/Bee/Android/Prj/IL2CPP/Gradle/**/*.log
            Logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Build skipped notice
        if: steps.check_license.outputs.has_license == 'false'
        run: |
          echo "UNITY_LICENSE secret not set - skipping real Unity build"
          echo "This is expected in forks without license"
          echo "Project structure verification passed in previous job"
          echo "BUILD NOT VERIFIED - requires Unity license in GitHub secrets"
          echo "To enable full build, add UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD secrets"
          echo "See https://game.ci/docs/github/activation"

  test:
    name: Run EditMode tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check for Unity license
        id: check_license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "has_license=false" >> $GITHUB_OUTPUT
          else
            echo "has_license=true" >> $GITHUB_OUTPUT
          fi

      - name: Cache Library
        if: steps.check_license.outputs.has_license == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Run tests
        if: steps.check_license.outputs.has_license == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.0f1
          testMode: EditMode
          customParameters: -logFile /tmp/test.log
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always() && steps.check_license.outputs.has_license == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Test-Results
          path: artifacts
          retention-days: 7

      - name: Tests skipped notice
        if: steps.check_license.outputs.has_license == 'false'
        run: |
          echo "UNITY_LICENSE not set - skipping tests"
          echo "Tests require Unity license"
